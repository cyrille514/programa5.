<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversor de Texto</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @import "tailwindcss";
      @layer base {
         :root {
          @apply text-sm;
           line-height: 1.5;
         }
      }
    </style>


</head>

<body class="bg-[url('photo.jpg')] bg-cover bg-center bg-no-repeat min-h-screen flex items-center justify-center p-4">

    <!-- Tarjeta principal responsiva: w-full en móviles, max-w-md/lg en pantallas grandes -->
    <main class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md md:max-w-lg transition-all">
        <h1 class="text-3xl font-bold text-orange-500 mb-6 text-center"> Inversor de Texto</h1>
        
        <form id="form-invertir" class="space-y-4">
            <!-- Campo único para ingresar la cadena -->
            <div>
                <label for="input-texto" class="block text-xl font-bold text-black mb-1">Ingresa tu texto:</label>
                <input type="text" id="input-texto" placeholder="Ej. Hola Mundo" required
                    class="w-full px-4 py-2 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
            </div>

            <button type="submit" 
                class="w-40 bg-gray-600 hover:bg-orange-500 text-white font-medium py-2.5 rounded-xl transition duration-200">
                Invertir Texto
            </button>
        </form>

        <!-- Contenedor del Resultado (Oculto dinámicamente al inicio con 'hidden') -->
        <div id="contenedor-resultado" class="mt-6 p-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl hidden transition-all duration-300 ease-out opacity-0 transform translate-y-2">
            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Resultado Invertido:</span>
            <p id="texto-resultado" class="text-lg font-mono font-bold text-indigo-600 break-all tracking-wide"></p>
        </div>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
